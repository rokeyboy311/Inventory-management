<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.8" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- Inner Badge Circle -->
  <circle cx="256" cy="256" r="184" fill="#0f172a" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Transformer Core Symbol (Two Interlocking Coils) -->
  <g transform="translate(256, 185)" filter="url(#shadow)">
    <!-- Left Coil -->
    <circle cx="-50" cy="0" r="48" fill="none" stroke="url(#cyanGrad)" stroke-width="12" />
    <!-- Right Coil -->
    <circle cx="50" cy="0" r="48" fill="none" stroke="url(#cyanGrad)" stroke-width="12" />
    <!-- Central Coupling Bar -->
    <rect x="-85" y="-6" width="170" height="12" rx="6" fill="url(#goldGrad)" />

    <!-- Lightning Zap Bolt (Center) -->
    <path d="M-8 -58 L22 -58 L6 -6 L34 -6 L-18 64 L-4 12 L-26 12 Z" fill="url(#goldGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Distinctive "Dk" Script Signature Monogram (From Reference Image) -->
  <g transform="translate(256, 310)" text-anchor="middle" filter="url(#shadow)">
    <!-- Cursive Signature "Dk" -->
    <text x="0" y="24" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive, sans-serif" font-size="76" font-style="italic" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">
      Dk
    </text>
  </g>

  <!-- App Title Banner -->
  <g transform="translate(256, 385)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#f8fafc" letter-spacing="3">
      PERFORMA TC
    </text>
  </g>

  <!-- Discom Voltage Dots -->
  <circle cx="160" cy="425" r="4" fill="#ef4444" /> <!-- Red Phase R -->
  <circle cx="256" cy="425" r="4" fill="#eab308" /> <!-- Yellow Phase Y -->
  <circle cx="352" cy="425" r="4" fill="#3b82f6" /> <!-- Blue Phase B -->
</svg>
